name: Release checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: northbridgeai_test
          POSTGRES_USER: northbridgeai
          POSTGRES_PASSWORD: northbridgeai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U northbridgeai -d northbridgeai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://northbridgeai:northbridgeai_test@localhost:5432/northbridgeai_test
      SECRET_KEY: ci-only-secret-key
      FRONTEND_URL: http://localhost:5173
      OPENAI_API_KEY: ci-placeholder
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      DOCUMENT_STORAGE_BACKEND: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements-dev.txt

      - name: Validate migration graph
        run: python -m alembic -c backend/alembic.ini heads

      - name: Apply all migrations to clean PostgreSQL
        run: python -m alembic -c backend/alembic.ini upgrade head

      - name: Run backend tests
        run: python -m pytest backend/tests --verbose -W error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build production bundle
        run: npm run build

  end-to-end:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: northbridgeai_e2e
          POSTGRES_USER: northbridgeai
          POSTGRES_PASSWORD: northbridgeai_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U northbridgeai -d northbridgeai_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://northbridgeai:northbridgeai_e2e@localhost:5432/northbridgeai_e2e
      DB_SSL_MODE: disable
      SECRET_KEY: ci-only-e2e-secret-key
      FRONTEND_URL: http://127.0.0.1:4173
      CORS_ORIGINS: http://127.0.0.1:4173
      OPENAI_API_KEY: ci-placeholder
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      DOCUMENT_STORAGE_BACKEND: local
      E2E_BACKEND_COMMAND: python -m uvicorn app.main:app --app-dir ../backend --host 127.0.0.1 --port 8010

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements-dev.txt

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Apply migrations to end-to-end database
        run: python -m alembic -c backend/alembic.ini upgrade head

      - name: Run registration and disclosure journey
        run: npm run test:e2e
        working-directory: frontend

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
